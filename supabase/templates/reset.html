<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px;background-color:#142535;font-family:Inter,Arial,sans-serif;color:#F7F7F7;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr>
        <td align="center">
          <table width="480" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#23384B;border-radius:16px;padding:32px;">
            <tr>
              <td>
                <h1 style="margin:0 0 12px;font-size:22px;color:#F7F7F7;">Reset your Inkubify password</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#F7F7F7;">
                  We received a request to reset your Inkubify password. Click the button below to choose a new password.
                </p>
                <p style="margin:0 0 24px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 24px;background-color:#C19829;color:#142535;font-weight:700;text-decoration:none;border-radius:10px;">
                    Reset password
                  </a>
                </p>
                <p style="margin:0;font-size:13px;color:#F7F7F7;opacity:0.75;">
                  If you did not request a password reset, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
